<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Controle de Qualidade Total Rumo</title>
  <link rel="stylesheet" href="css/style.css?v=20260828-sem-logo-v1">
  <link rel="stylesheet" href="css/rumo-brand.css?v=20260730-brandbook-dark-v2">
  <link rel="stylesheet" href="css/rumo-ui.css?v=20260905-2">
</head>
<body>
  <main class="login-page">
    <div class="login-shell">
      <section class="login-brand" aria-label="Identidade Rumo">
        <div class="login-brand-copy">
          <span class="login-brand-eyebrow">Qualidade ferroviária</span>
          <h2>Somos o Brasil em movimento.</h2>
          <p>Controle integrado da produção, dos ensaios, das liberações e dos indicadores de dormentes de concreto.</p>
        </div>
      </section>

      <section class="login-card">
        <div class="login-kicker">Sistema de Qualidade</div>
        <h1>Acesse sua conta</h1>
        <p>Entre com suas credenciais para acompanhar a qualidade ferroviária.</p>

        <form id="formLogin" class="login-form">
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" autocomplete="email" required placeholder="seu.email@empresa.com">
          </div>
          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" autocomplete="current-password" required placeholder="Sua senha">
          </div>
          <button class="btn btn-primario" id="btnEntrar" type="submit">Entrar</button>
        </form>

        <div id="loginMensagem" class="login-msg" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');}</script>
  <script src="js/supabase-config.js?v=20260523-2"></script>
  <script src="js/auth.js?v=20260828-sem-logo-v1"></script>
  <script src="js/login.js?v=20260523-2"></script>
  <script src="js/subir-pagina.js?v=20260619-subir-pagina-v1"></script>
  <script src="js/login-trem-fujao.js?v=20260702-trem-fujao-v2"></script>
</body>
</html>
