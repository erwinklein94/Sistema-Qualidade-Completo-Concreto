<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Conprem · Controle de Dormentes Rumo</title>

  <link rel="stylesheet" href="css/style.css?v=20260908-area-amv-v1">
  <link rel="stylesheet" href="css/rumo-brand.css?v=20260730-brandbook-dark-v2">
  <link rel="stylesheet" href="css/rumo-ui.css?v=20260908-compacto-v3">
</head>
<body>
  <div class="app" id="app">
    <main class="conteudo" id="conteudo">
      <div class="pagina">

        <div class="barra-filtros">
          <div class="campo"><label for="fProjeto">Projeto</label><select id="fProjeto"></select></div>
          <div class="campo"><label for="fBitola">Bitola</label><select id="fBitola"></select></div>
          <div class="campo"><label for="fPedido">Pedido</label><select id="fPedido"></select></div>
          <div class="campo"><label for="fSemana">Semana</label><select id="fSemana"></select></div>
          <div class="campo"><label for="fPeriodoIni">Período inicial</label><input type="date" id="fPeriodoIni"></div>
          <div class="campo"><label for="fPeriodoFim">Período fim</label><input type="date" id="fPeriodoFim"></div>
          <button class="btn btn-secundario btn-sm" id="btnUltimaSemana" type="button">Última semana</button>
          <button class="btn btn-secundario btn-sm" id="btnLimparFiltros" type="button">Limpar filtros</button>
        </div>

        <div class="grid-kpi" id="kpis"></div>
        <div id="painel"></div>
        <section id="quadroAvisosDashboard" class="dashboard-avisos" aria-live="polite"></section>

      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');}</script>
  <!-- Área CONPREM: definida antes dos scripts para que store, config e menu
       apontem para as tabelas conprem_* e para o fornecedor Conprem MG. -->
  <script>window.AREA_EMPRESA = 'conprem';</script>
  <script src="js/supabase-config.js?v=20260523-2"></script>
  <script src="js/auth.js?v=20260908-sem-auditoria-v1"></script>
  <script>Auth.exigirLogin();</script>
  <script src="js/area.js?v=20260819-conprem-proprio-v1"></script>
  <script src="js/config.js?v=20260819-conprem-proprio-v1"></script>
  <script src="js/store.js"></script>
  <script src="js/store-supabase.js?v=20260923-conprem-dashboard-v1"></script>
  <script src="js/exportacoes.js?v=20260528-dashboard-pdf-graficos"></script>
  <script src="js/comum.js?v=20260908-sem-auditoria-v1"></script>
  <script src="js/festa-hexa.js?v=20260610-copa-hexa-v2"></script>
  <script src="js/conprem-dashboard.js?v=20260923-graficos-avisos-v1"></script>
  <script src="js/subir-pagina.js?v=20260619-subir-pagina-v1"></script>
</body>
</html>
