<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Histórico e dashboard das inspeções de recebimento de dormentes de madeira.">
<title>Histórico de Dormentes de Madeira · Controle de Qualidade Rumo</title>
<link rel="stylesheet" href="css/style.css?v=20260908-area-amv-v1"><link rel="stylesheet" href="css/rumo-brand.css?v=20260730-brandbook-dark-v2"><link rel="stylesheet" href="css/rumo-ui.css?v=20260908-compacto-v3"><link rel="stylesheet" href="css/madeira.css?v=20260909-v1">
</head><body data-pagina="madeira-inspecoes" data-sem-empresa="1">
<div class="app" id="app"><main class="conteudo" id="conteudo"><div class="pagina">
<form id="filtrosMadeira" class="barra-filtros" onsubmit="return false">
<div class="campo"><label for="busca">Buscar</label><input id="busca" type="search" placeholder="Fornecedor, pedido, NF, local"></div>
<div class="campo"><label for="fFornecedor">Fornecedor</label><select id="fFornecedor"><option value="">Todos</option></select></div>
<div class="campo"><label for="fResponsavel">Responsável</label><select id="fResponsavel"><option value="">Todos</option></select></div>
<div class="campo"><label for="fProjeto">Projeto</label><select id="fProjeto"><option value="">Todos</option></select></div>
<div class="campo"><label for="fTipo">Tipo de dormente</label><select id="fTipo"><option value="">Todos</option></select></div>
<div class="campo"><label for="fVersao">Versão do relatório</label><select id="fVersao"><option value="">Todas</option><option value="recebimento_v1">Recebimento v1</option><option value="recebimento_v2">Recebimento v2 · tipo</option><option value="recebimento_v3">Recebimento v3 · umidade</option><option value="recebimento_v4">Recebimento v4 · atual</option><option value="dormente_lei_fornecedor">Dormente de lei · fornecedor</option></select></div>
<div class="campo"><label for="fStatus">Situação</label><select id="fStatus"><option value="">Todas</option><option value="concluida">Concluída</option><option value="rascunho">Rascunho</option></select></div>
<div class="campo"><label for="fDataIni">De</label><input id="fDataIni" type="date"></div><div class="campo"><label for="fDataFim">Até</label><input id="fDataFim" type="date"></div>
<button type="button" class="btn btn-secundario btn-sm" id="limparMadeira">Limpar filtros</button>
</form>
<div id="estadoMadeira" class="madeira-estado" role="status" aria-live="polite"></div>
<div class="grid-kpi" id="kpisMadeira"></div>
<p class="madeira-nota">A taxa consolidada usa somente relatórios com quantidade declarada e quantidade reprovada. Campos ausentes nas versões antigas permanecem como “não informado”. As contagens refletem o que foi registrado pelos fiscais.</p>
<div id="analiseMadeira"></div>
<section class="card"><div class="card-titulo"><span>Histórico de inspeções</span><span class="txt-mini" id="contadorMadeira"></span></div><div id="listaMadeira"></div></section>
</div></main></div>
<dialog id="detalheMadeira" class="madeira-dialog" aria-labelledby="tituloDetalheMadeira"><div class="modal-cab"><h2 id="tituloDetalheMadeira">Relatório de inspeção</h2><button type="button" class="fechar-modal" data-fechar-madeira aria-label="Fechar">×</button></div><div class="modal-corpo" id="detalheCorpo"></div></dialog>
<div class="toast-wrap" id="toastWrap" aria-live="polite" aria-atomic="true"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');}</script>
<script src="js/supabase-config.js?v=20260531-topo-limpo-v1"></script><script src="js/auth.js?v=20260908-sem-auditoria-v1"></script><script src="js/area.js?v=20260819-conprem-proprio-v1"></script><script src="js/config.js?v=20260819-conprem-proprio-v1"></script><script src="js/exportacoes.js?v=20260531-topo-limpo-v1"></script><script src="js/comum.js?v=20260909-madeira-v1"></script><script src="js/festa-hexa.js?v=20260610-copa-hexa-v2"></script><script src="js/madeira-comum.js?v=20260909-v1"></script><script src="js/store-madeira-supabase.js?v=20260909-v1"></script><script src="js/madeira-pagina.js?v=20260909-v1"></script><script src="js/subir-pagina.js?v=20260619-subir-pagina-v1"></script>
</body></html>
