<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Painel de inspeção de peças de aparelho de mudança de via (AMV)." />
  <title>Dashboard AMV · Controle de Qualidade Rumo</title>

  <link rel="stylesheet" href="css/style.css?v=20260908-area-amv-v1" />
  <link rel="stylesheet" href="css/rumo-brand.css?v=20260730-brandbook-dark-v2">
  <link rel="stylesheet" href="css/rumo-ui.css?v=20260908-compacto-v3">
</head>
<body data-pagina="amv" data-sem-empresa="1">
  <div class="app" id="app">
    <main class="conteudo" id="conteudo">
      <div class="pagina">

        <div class="barra-filtros">
          <div class="campo"><label>Fornecedor</label><select id="fFornecedor"></select></div>
          <div class="campo"><label>Projeto</label><select id="fProjeto"></select></div>
          <div class="campo"><label>Responsável</label><select id="fResponsavel"></select></div>
          <div class="campo"><label>De</label><input type="date" id="fDataIni"></div>
          <div class="campo"><label>Até</label><input type="date" id="fDataFim"></div>
        </div>

        <div class="grid-kpi" id="kpis"></div>

        <div class="grid-graficos">
          <div class="card">
            <div class="card-titulo"><span class="acento">Inspeções por fornecedor</span></div>
            <div class="chart-box"><canvas id="chartFornecedor"></canvas></div>
          </div>
          <div class="card">
            <div class="card-titulo"><span class="acento">Peças por família</span></div>
            <div class="chart-box"><canvas id="chartFamilia"></canvas></div>
          </div>
        </div>

        <div class="card">
          <div class="card-titulo">
            <span class="acento">Peças programadas, disponíveis e ajustadas por mês</span>
            <span class="card-sub">Quantidades declaradas no cabeçalho de cada relatório</span>
          </div>
          <div class="chart-box alto"><canvas id="chartMes"></canvas></div>
        </div>

        <div class="card">
          <div class="card-titulo">
            <span class="acento">Peças com defeito registrado</span>
            <span class="txt-mini txt-cinza" id="contadorDefeitos">—</span>
          </div>
          <div id="listaDefeitos"></div>
        </div>

        <div class="card">
          <div class="card-titulo">
            <span class="acento">Últimas inspeções</span>
            <span class="card-sub">As 15 mais recentes do filtro</span>
          </div>
          <div id="listaUltimas"></div>
        </div>

      </div>
    </main>
  </div>

  <div class="toast-wrap" id="toastWrap" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');}</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="js/supabase-config.js?v=20260531-topo-limpo-v1"></script>
  <script src="js/auth.js?v=20260908-sem-auditoria-v1"></script>
  <script src="js/area.js?v=20260819-conprem-proprio-v1"></script>
  <script src="js/config.js?v=20260819-conprem-proprio-v1"></script>
  <script src="js/exportacoes.js?v=20260531-topo-limpo-v1"></script>
  <script src="js/comum.js?v=20260908-sem-auditoria-v1"></script>
  <script src="js/festa-hexa.js?v=20260610-copa-hexa-v2"></script>
  <script src="js/store-amv-supabase.js?v=20260908-area-amv-v1"></script>
  <script src="js/amv-comum.js?v=20260908-area-amv-v1"></script>
  <script src="js/amv-dashboard.js?v=20260908-area-amv-v1"></script>
  <script src="js/subir-pagina.js?v=20260619-subir-pagina-v1"></script>
</body>
</html>
